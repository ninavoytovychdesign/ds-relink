<style>
  :root { --bg: var(--figma-color-bg, #fff); --fg: var(--figma-color-text, #1e1e1e); --muted: var(--figma-color-text-secondary, #6a6f77); --line: var(--figma-color-border, #e5e5e5); --accent: var(--figma-color-bg-brand, #0d99ff); --onaccent: var(--figma-color-text-onbrand, #fff); --soft: var(--figma-color-bg-secondary, #f5f5f5); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  html, body { height: 100%; overflow-y: auto; }
  .wrap { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 14px; margin: 0; }
  p { margin: 0; color: var(--muted); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  legend { padding: 0 4px; font-weight: 600; }
  label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  label small { display: block; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  button { flex: 1; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--onaccent); border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); min-height: 18px; }
  #out { min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--soft); white-space: pre-wrap; }
  #out h3 { margin: 8px 0 4px; font-size: 12px; }
  #out ul { margin: 0; padding-left: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang button { flex: none; height: 24px; padding: 0 10px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 11px; }
  .lang button[aria-pressed="true"] { background: var(--soft); color: var(--fg); }
</style>
<div class="wrap">
  <div>
    <div class="head">
      <h1>DS Relink</h1>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="uk" aria-pressed="false">UA</button>
      </div>
    </div>
    <p data-i="intro"></p>
  </div>

  <fieldset>
    <legend data-i="scope"></legend>
    <label><input type="radio" name="scope" value="file" checked> <span data-i="scopeFile"></span></label>
    <label><input type="radio" name="scope" value="page"> <span data-i="scopePage"></span></label>
    <label><input type="radio" name="scope" value="selection"> <span data-i="scopeSel"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i="what"></legend>
    <label><input type="checkbox" id="components" checked><span><span data-i="comp"></span><small data-i="compHint"></small></span></label>
    <label style="padding-left:22px"><input type="checkbox" id="createComponents" checked><span data-i="createComp"></span></label>
    <label><input type="checkbox" id="tokens" checked><span><span data-i="tokens"></span><small data-i="tokensHint"></small></span></label>
    <label><input type="checkbox" id="raw" checked><span><span data-i="raw"></span><small data-i="rawHint"></small></span></label>
    <label style="padding-left:22px"><input type="checkbox" id="createRaw"><span><span data-i="createRaw"></span><small data-i="createRawHint"></small></span></label>
  </fieldset>

  <div class="row">
    <button id="dry" data-i="dry"></button>
    <button id="run" class="primary" data-i="run"></button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  function opts() {
    return {
      scope: document.querySelector('input[name=scope]:checked').value,
      components: $('components').checked,
      createComponents: $('createComponents').checked,
      tokens: $('tokens').checked,
      raw: $('raw').checked,
      createRaw: $('createRaw').checked,
    };
  }
  function start(dry) {
    $('dry').disabled = $('run').disabled = true;
    last = null; $('out').dataset.busy = '1'; $('out').textContent = '';
    statusKey = 'working'; renderStatus();
    const o = opts(); o.lang = lang;
    parent.postMessage({ pluginMessage: { type: 'run', dry, opts: o } }, '*');
  }
  $('dry').onclick = () => start(true);
  $('run').onclick = () => start(false);

  const STR = {
    en: {
      intro: 'Makes variables, styles and components from other files local and relinks your screens to them. Duplicate the file before the first run.',
      scope: 'Where', scopeFile: 'Whole file', scopePage: 'Current page', scopeSel: 'Selection',
      what: 'What to do',
      comp: 'Components', compHint: 'Instances from other files → local components. If the file has no such component, create it on the “Local components · DS Relink” page.',
      createComp: 'Create missing components',
      tokens: 'Variables and styles', tokensHint: 'Colors, spacing, text styles and effects from libraries → local ones with the same names.',
      raw: 'Unbound values', rawHint: 'Colors without a variable and text without a style → file variables and styles, exact match only.',
      createRaw: 'Create variables/styles when there’s no match', createRawHint: 'They go to “DS Relink · found colors” and “DS Relink/…” – worth reviewing.',
      dry: 'Check without changes', run: 'Run',
      outHint: 'Start with “Check without changes” – the plugin will show exactly what it’s going to do.',
      working: 'Working…', error: 'Error: ',
      dryDone: 'Check: nothing was changed. Below is what will be done.', runDone: 'Done. You can undo with Cmd/Ctrl+Z.',
      willDo: 'Will be done', did: 'Done', issuesNote: 'Issue details are in the language of the last run – run the check again to see them in English.',
      stats: { nodes: 'Layers checked', remoteInstances: 'Instances from other files', instancesSwapped: 'Instances switched to local', componentsCreated: 'Components created', setsCreated: 'Variant sets created', varsCreated: 'Variables created', varsReused: 'Existing variables reused', varBindings: 'Variable bindings relinked', stylesCreated: 'Styles created', stylesReused: 'Existing styles reused', styleBindings: 'Style bindings relinked', rawColorsBound: 'Colors bound to variables', rawColorsCreated: 'New color variables', rawTextsBound: 'Texts bound to styles', rawTextStylesCreated: 'New text styles', errors: 'Errors' },
    },
    uk: {
      intro: 'Робить локальними змінні, стилі й компоненти з інших файлів і перев\'язує на них екрани. Перед першим запуском зробіть копію файлу.',
      scope: 'Де', scopeFile: 'Увесь файл', scopePage: 'Поточна сторінка', scopeSel: 'Виділене',
      what: 'Що робити',
      comp: 'Компоненти', compHint: 'Інстанси з інших файлів → локальні компоненти. Якщо такого компонента у файлі немає – створити його на сторінці «Локальні компоненти · DS Relink».',
      createComp: 'Створювати відсутні компоненти',
      tokens: 'Змінні та стилі', tokensHint: 'Кольори, відступи, текстові стилі й ефекти з бібліотек → локальні з тими самими назвами.',
      raw: 'Неприв\'язані значення', rawHint: 'Кольори без змінної і тексти без стилю → до змінних і стилів файлу за точним збігом.',
      createRaw: 'Створювати змінні/стилі, якщо збігу немає', createRawHint: 'Потраплять у «DS Relink · знайдені кольори» та «DS Relink/…» – їх варто переглянути.',
      dry: 'Перевірити без змін', run: 'Запустити',
      outHint: 'Спочатку натисніть «Перевірити без змін» – плагін покаже, що саме зробить.',
      working: 'Працюю…', error: 'Помилка: ',
      dryDone: 'Перевірка: нічого не змінено. Нижче – що буде зроблено.', runDone: 'Готово. Скасувати можна через Cmd/Ctrl+Z.',
      willDo: 'Буде зроблено', did: 'Зроблено', issuesNote: 'Деталі проблем – мовою останнього запуску. Запустіть перевірку ще раз, щоб побачити їх українською.',
      stats: { nodes: 'Вузлів переглянуто', remoteInstances: 'Інстансів з інших файлів', instancesSwapped: 'Інстансів переключено на локальні', componentsCreated: 'Компонентів створено', setsCreated: 'Наборів варіантів створено', varsCreated: 'Змінних створено', varsReused: 'Змінних знайдено готових', varBindings: 'Прив\'язок до змінних перев\'язано', stylesCreated: 'Стилів створено', stylesReused: 'Стилів знайдено готових', styleBindings: 'Прив\'язок до стилів перев\'язано', rawColorsBound: 'Кольорів прив\'язано до змінних', rawColorsCreated: 'Нових змінних кольору', rawTextsBound: 'Текстів прив\'язано до стилів', rawTextStylesCreated: 'Нових текстових стилів', errors: 'Помилок' },
    },
  };
  let lang = 'en';
  let last = null;      // останній результат
  let statusKey = null; // ключ статусу для перекладу
  let errMsg = '';
  const T = () => STR[lang];
  function setLang(l, save) {
    lang = l === 'uk' ? 'uk' : 'en';
    document.documentElement.lang = lang === 'uk' ? 'uk' : 'en';
    document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = T()[el.dataset.i]; });
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    renderOut(); renderStatus();
    if (save) parent.postMessage({ pluginMessage: { type: 'setLang', lang } }, '*');
  }
  document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => setLang(b.dataset.lang, true); });
  setLang('en', false);
  function renderStatus() {
    if (!statusKey) return;
    $('status').textContent = statusKey === 'error' ? T().error + errMsg : T()[statusKey];
  }
  function renderOut() {
    if (!last) { if (!$('out').dataset.busy) $('out').textContent = T().outHint; return; }
    const r = last; const S = T().stats;
    let h = '<h3>' + (r.dry ? T().willDo : T().did) + '</h3><ul>';
    for (const k of Object.keys(S)) if (r.stats[k]) h += '<li>' + S[k] + ': <b>' + r.stats[k] + '</b></li>';
    h += '</ul>';
    const issues = (r.issuesByLang && r.issuesByLang[lang]) || r.issues;
    for (const k of Object.keys(issues)) {
      h += '<h3>' + esc(k) + ' (' + issues[k].length + ')</h3><ul>' + issues[k].slice(0, 60).map((x) => '<li>' + esc(x) + '</li>').join('') + (issues[k].length > 60 ? '<li>…</li>' : '') + '</ul>';
    }
    if (r.issuesLang && r.issuesLang !== lang && Object.keys(issues).length) h += '<p>' + T().issuesNote + '</p>';
    $('out').innerHTML = h;
  }
  function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  onmessage = (e) => {
    const m = e.data.pluginMessage; if (!m) return;
    if (m.type === 'lang') { setLang(m.lang, false); return; }
    if (m.type === 'progress') { statusKey = null; $('status').textContent = m.msg; }
    if (m.type === 'error') { delete $('out').dataset.busy; statusKey = 'error'; errMsg = m.msg; renderStatus(); renderOut(); $('dry').disabled = $('run').disabled = false; }
    if (m.type === 'done') {
      delete $('out').dataset.busy; last = m.result; statusKey = last.dry ? 'dryDone' : 'runDone';
      renderStatus(); renderOut();
      $('status').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('dry').disabled = $('run').disabled = false;
    }
  };
</script>
